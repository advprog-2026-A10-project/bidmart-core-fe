name: cd-docker

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      CONTAINER_NAME: bidmart-core-fe
      HOST_PORT: 80
      CONTAINER_PORT: 3000
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_AUTH_API_BASE_URL: ${{ vars.VITE_AUTH_API_BASE_URL }}
      VITE_AUTH_LOGIN_URL: ${{ vars.VITE_AUTH_LOGIN_URL }}
      VITE_REDIRECT_URL: ${{ vars.VITE_REDIRECT_URL }}
      VITE_BIDDING_WS_URL: ${{ vars.VITE_BIDDING_WS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Check build configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VITE_API_BASE_URL:-}" ]]; then
            echo "Missing repository variable VITE_API_BASE_URL for core API routing."
            exit 1
          fi

          if [[ -z "${VITE_AUTH_API_BASE_URL:-}" ]]; then
            echo "Missing repository variable VITE_AUTH_API_BASE_URL for auth session validation."
            exit 1
          fi

          if [[ -z "${VITE_AUTH_LOGIN_URL:-}" ]]; then
            echo "Missing repository variable VITE_AUTH_LOGIN_URL for auth redirect guard."
            exit 1
          fi

          if [[ -z "${VITE_BIDDING_WS_URL:-}" ]]; then
            echo "Missing repository variable VITE_BIDDING_WS_URL for realtime bidding socket."
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_AUTH_API_BASE_URL=${{ env.VITE_AUTH_API_BASE_URL }}
            VITE_AUTH_LOGIN_URL=${{ env.VITE_AUTH_LOGIN_URL }}
            VITE_REDIRECT_URL=${{ env.VITE_REDIRECT_URL }}
            VITE_BIDDING_WS_URL=${{ env.VITE_BIDDING_WS_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-ec2:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      CONTAINER_NAME: bidmart-core-fe
      HOST_PORT: 80
      CONTAINER_PORT: 3000
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Check deploy prerequisites
        id: deploy_gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${EC2_HOST:-}" && -n "${EC2_USER:-}" && -n "${EC2_SSH_KEY:-}" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "EC2 secrets are not fully configured. Skipping deployment step."
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 via SSH
        if: steps.deploy_gate.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${IMAGE}"
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              docker rm -f "${CONTAINER_NAME}"
            fi
            docker run -d --restart unless-stopped \
              --name "${CONTAINER_NAME}" \
              -p "${HOST_PORT}:${CONTAINER_PORT}" \
              "${IMAGE}"
